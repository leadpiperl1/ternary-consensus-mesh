name: Ternary Consensus Mesh Waystation CI

on:
  push:
    branches: [ "main", "waystation/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  waystation-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository (Zero Persisted Credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Static Workflow Security Audit (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

      - name: Verify 64-Byte C99 Frame (malloc = 0), Pure-Stdlib Harness & wfx-loot Immunity
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache"
          make verify
